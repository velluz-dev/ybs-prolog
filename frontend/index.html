<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YBS — ခရီးစဉ်ရှာဖွေမှု (AI Demo)</title>
    <!-- Leaflet is vendored, not loaded from a CDN: the demo must run with the
         network cable unplugged. Map TILES still need the internet; if they fail
         the routes and buses stay visible on a plain background. -->
    <link rel="stylesheet" href="/vendor/leaflet.css">
    <link rel="icon" href="/img/logo.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="shell">

<!-- ── Sidebar ──────────────────────────────────────────────────────────────
     One feature per view. The nav itself is built by app.js from the role that
     is selected, so a rider is never shown the admin screens and a driver is
     never shown someone else's numbers. -->
<aside class="sidebar">
    <div class="brand">
        <div class="brand-mark">
            <!-- The real logo, with the lettered tile behind it: if the file is
                 missing the mark is still a mark rather than an empty square. -->
            <img src="/img/logo.png" alt="YBS"
                 onload="this.parentElement.classList.add('has-logo')">
        </div>
        <div>
            <div class="brand-my" data-i18n="brand.name"></div>
            <div class="brand-en" data-i18n="brand.sub"></div>
        </div>
        <div id="lang-switch"></div>
    </div>

    <!-- A greeting, because the first thing a nervous user should meet is a sentence
         and not a control panel. -->
    <div class="hello">
        <div id="hello-art" class="hello-art" aria-hidden="true"></div>
        <span class="hello-sun" aria-hidden="true">🌞</span>
        <div>
            <div class="hello-title" data-i18n="hello.title"></div>
            <div class="hello-body" data-i18n="hello.body"></div>
        </div>
    </div>

    <div class="role-switch-wrap">
        <div class="side-label" data-i18n="role.switch"></div>
        <div id="role-switch" class="role-switch"></div>
        <!-- Who is signed in, and the way out. Empty for a rider, who never signed in. -->
        <div id="identity"></div>
    </div>

    <nav id="nav"></nav>

    <div class="sidebar-foot">
        <!-- Appearance first, simulation second: one of these is for the rider and the
             other is for whoever is demonstrating. -->
        <div class="pref-row">
            <button type="button" id="theme-toggle" class="pref-toggle">
                <span class="ic" id="theme-glyph" aria-hidden="true">☀️</span>
                <span id="theme-label" data-i18n="pref.light"></span>
            </button>
            <div class="text-size" id="text-size" role="group" data-i18n-aria="pref.textSize"></div>
        </div>

        <div class="foot-label" data-i18n="sim.speed"></div>
        <div id="sim-controls"></div>
        <div id="side-art"></div>
    </div>
</aside>

<!-- ── Views ──────────────────────────────────────────────────────────────── -->
<main class="content">

<!-- Read aloud, language, help. Fixed to the top of every view because the person
     who needs them needs them everywhere, not only on the planner. -->
<div class="topbar">
    <!-- The content panel gets its own masthead. The sidebar identifies the app to
         someone sitting in front of it; this identifies the page itself, which is what
         ends up in a screenshot or on a projector where the sidebar is cropped off. -->
    <div class="topbar-brand">
        <img class="topbar-logo" src="/img/logo.png" alt=""
             onerror="this.remove()" onload="this.parentElement.classList.add('has-logo')">
        <div>
            <div class="topbar-name" data-i18n="brand.name"></div>
        </div>
    </div>

    <div class="topbar-actions">
        <button type="button" id="listen-btn" class="pill-btn">
            <span class="ic" aria-hidden="true">🔊</span><span data-i18n="a11y.listen"></span>
        </button>
        <div id="lang-switch-top"></div>
        <button type="button" id="help-btn" class="pill-btn">
            <span class="ic" aria-hidden="true">❓</span><span data-i18n="a11y.help"></span>
        </button>
    </div>
</div>

<!-- PLAN ------------------------------------------------------------------->
<section class="view" data-view="plan">
    <header class="view-head">
        <div id="head-art" class="head-art" aria-hidden="true"></div>
        <h1>🗺️ <span data-i18n="plan.h1"></span></h1>
        <p class="lede" data-i18n="plan.lede"></p>
    </header>

    <div class="plan-grid">
            <section class="card">
                <div class="card-head">
                    <span class="step-no">1</span>
                    <h2 data-i18n="step.how"></h2>
                    <button type="button" class="info" data-i18n-title="step.how.info">i</button>
                </div>
                <!-- Press to talk. The old control was a dropdown of three canned
                     sentences and a button that "played" one of them; this listens. The
                     samples survive underneath, because a venue with no microphone
                     permission - or no recogniser running - still has to demo. -->
                <div class="speak-panel">
                    <div class="mic-wrap">
                        <button type="button" id="mic-btn" class="mic-big" aria-live="polite">
                            <span class="mic-glyph">🎤</span>
                            <span class="mic-label" data-i18n="voice.hold"></span>
                        </button>
                        <div class="mic-meter" id="mic-meter" aria-hidden="true"><span></span></div>
                    </div>
                    <div class="mic-hint" data-i18n="voice.tapHint"></div>
                </div>

                <div id="voice-status" class="muted"></div>
                <div id="voice-entities"></div>

                <div class="or-rule" data-i18n="voice.or"></div>

                <details class="voice-fallback">
                    <summary data-i18n="voice.orSample"></summary>
                    <div class="voice-row">
                        <button type="button" id="voice-btn" class="alt-btn">▶ <span data-i18n="voice.play"></span></button>
                        <select id="voice-sample" data-i18n-title="voice.sampleLabel"
                                data-i18n-aria="voice.sampleLabel"></select>
                    </div>
                </details>
            </section>

            <section class="card">
                <div class="card-head">
                    <span class="step-no">2</span>
                    <h2 data-i18n="step.stops"></h2>
                    <button type="button" class="info" data-i18n-title="step.stops.info">i</button>
                </div>
                <div class="stops-stack">

                <!-- Type-and-search, not a 2,080-option <select>. The chosen stop id
                     lives in the hidden input, so everything downstream still reads
                     document.getElementById('from-stop').value exactly as before. -->
                <div class="trip-field">
                    <span class="ic">🔵</span>
                    <div class="grow stop-picker" data-picker="from-stop">
                        <label class="field-label" for="from-stop-input" data-i18n="stops.from"></label>
                        <input type="text" class="stop-input" id="from-stop-input" autocomplete="off"
                               role="combobox" aria-expanded="false" aria-autocomplete="list"
                               aria-controls="from-stop-list" data-i18n-ph="stops.placeholder">
                        <input type="hidden" id="from-stop">
                        <ul class="stop-list" id="from-stop-list" role="listbox" hidden></ul>
                    </div>
                    <span class="field-chevron" aria-hidden="true">›</span>
                </div>

                <div class="trip-field">
                    <span class="ic">📍</span>
                    <div class="grow stop-picker" data-picker="to-stop">
                        <label class="field-label" for="to-stop-input" data-i18n="stops.to"></label>
                        <input type="text" class="stop-input" id="to-stop-input" autocomplete="off"
                               role="combobox" aria-expanded="false" aria-autocomplete="list"
                               aria-controls="to-stop-list" data-i18n-ph="stops.placeholder">
                        <input type="hidden" id="to-stop">
                        <ul class="stop-list" id="to-stop-list" role="listbox" hidden></ul>
                    </div>
                    <span class="field-chevron" aria-hidden="true">›</span>
                </div>

                <!-- Swap sits between the two fields because that is what it means. -->
                <button type="button" id="swap-btn" class="swap-btn"
                        data-i18n-aria="stops.swap" data-i18n-title="stops.swap">⇅</button>
                </div>

                <button type="button" id="search-btn" class="btn-primary">🔍 <span data-i18n="stops.searchRoute"></span></button>

                <!-- Somewhere to start for a rider who does not know a stop name yet. -->
                <div class="quick-row" id="quick-picks"></div>
            </section>

            <section class="card">
                <div class="card-head">
                    <span class="ic">👤</span>
                    <h2 data-i18n="profile.h2"></h2>
                    <span class="optional" data-i18n="profile.optional"></span>
                    <button type="button" class="info" data-i18n-title="profile.hint">i</button>
                </div>
                <p class="hint" data-i18n="profile.hint"></p>
                <div id="profile" class="chips"></div>
                <div class="disruption-row">
                    <span class="ic">🌊</span>
                    <div class="grow">
                        <div class="my" data-i18n="flood.title"></div>
                        <div class="en" data-i18n="flood.sub"></div>
                    </div>
                    <button type="button" id="flood-btn" class="alt-btn" data-i18n="flood.btn"></button>
                    <button type="button" id="clear-btn" class="alt-btn">✖</button>
                </div>
            </section>

            <section class="tips-card">
                <span class="ic" aria-hidden="true">💡</span>
                <div class="tips-copy">
                    <div class="tips-title" data-i18n="tips.title"></div>
                    <div class="tips-body" data-i18n="tips.body"></div>
                </div>
                <div class="tips-art" id="tips-art" aria-hidden="true"></div>
            </section>
    </div>

    <!-- Results appear only once there are some. An empty panel captioned "nothing
         here yet" is a box a first-time user has to work out the purpose of before
         they can ignore it. -->
    <div id="results-panel" class="results-panel hidden">
        <div class="results-head">
            <h2 data-i18n="results.h2"></h2>
            <span class="pareto-badge" id="pareto-badge"></span>
        </div>
        <div id="results"></div>
    </div>

    <div class="promise-row" id="promises"></div>
    <div class="app-foot" data-i18n="foot.tagline"></div>
</section>

<!-- MAP -------------------------------------------------------------------->
<section class="view" data-view="map">
    <header class="view-head">
        <h1>🗺️ <span id="map-title" data-i18n="map.h1"></span></h1>
        <p class="lede" id="map-lede" data-i18n="map.lede"></p>
    </header>
    <section class="card route-picker" id="route-picker-card">
        <div class="card-head"><span class="ic">🚌</span><h2 data-i18n="map.pick.h2"></h2></div>
        <p class="hint" data-i18n="map.pick.sub"></p>
        <div class="picker-top">
            <input type="text" id="route-search" data-i18n-ph="map.pick.placeholder"
                   data-i18n-aria="map.pick.placeholder">
            <span id="route-count" class="en"></span>
            <label class="inline-check">
                <input type="checkbox" id="buses-selected-only">
                <span data-i18n="map.pick.selectedOnly"></span>
            </label>
            <button type="button" id="route-clear" class="alt-btn" data-i18n="map.pick.clear"></button>
        </div>
        <div id="route-filter" class="route-filter"></div>
    </section>

    <section class="card">
        <div id="map"></div>
        <div id="map-note" class="muted hidden">⚠️ <span data-i18n="map.offline"></span></div>
        <div id="trip-countdown" class="countdown muted" data-i18n="map.tripEmpty"></div>
        <div id="legend" class="legend"></div>
    </section>
</section>

<!-- ARRIVALS --------------------------------------------------------------->
<section class="view" data-view="arrivals">
    <header class="view-head">
        <h1>⏱️ <span data-i18n="arrivals.h1"></span></h1>
        <p class="lede" data-i18n="arrivals.lede"></p>
    </header>
    <section class="card">
        <div class="trip-field">
            <span class="ic">🚏</span>
            <div class="grow stop-picker" data-picker="arrivals-stop">
                <label class="field-label" for="arrivals-stop-input" data-i18n="stops.stop"></label>
                <input type="text" class="stop-input" id="arrivals-stop-input" autocomplete="off"
                       role="combobox" aria-expanded="false" aria-autocomplete="list"
                       aria-controls="arrivals-stop-list" data-i18n-ph="stops.placeholder">
                <input type="hidden" id="arrivals-stop">
                <ul class="stop-list" id="arrivals-stop-list" role="listbox" hidden></ul>
            </div>
        </div>
        <div id="arrivals-board" class="empty-state muted" data-i18n="arrivals.empty"></div>
        <p class="hint" data-i18n="arrivals.hint"></p>
    </section>
</section>

<!-- TRACE ------------------------------------------------------------------>
<section class="view" data-view="trace">
    <header class="view-head">
        <h1>🔍 <span data-i18n="trace.h1"></span></h1>
        <p class="lede" data-i18n="trace.lede"></p>
    </header>
    <section class="card">
        <div id="search-stats" class="stats"></div>
        <div id="trace-panel" class="trace muted" data-i18n="trace.empty"></div>
        <p class="hint" data-i18n="trace.hint"></p>
    </section>
</section>

<!-- PROLOG ----------------------------------------------------------------->
<section class="view" data-view="prolog">
    <header class="view-head">
        <h1>🧠 <span data-i18n="prolog.h1"></span></h1>
        <p class="lede" data-i18n="prolog.lede"></p>
    </header>
    <section class="card">
        <div class="console-row">
            <span class="prompt">?-</span>
            <input type="text" id="goal-input" spellcheck="false" aria-label="Prolog goal">
            <button type="button" id="goal-run" class="btn-run" data-i18n="prolog.solve"></button>
        </div>
        <div class="preset-row" id="goal-presets"></div>
        <div id="goal-output" class="console-out muted" data-i18n="prolog.empty"></div>
        <p class="hint" data-i18n="prolog.hint"></p>
    </section>
</section>

<!-- FLEET ------------------------------------------------------------------>
<section class="view" data-view="fleet">
    <header class="view-head">
        <h1>🚌 <span data-i18n="fleet.h1"></span></h1>
        <p class="lede" data-i18n="fleet.lede"></p>
    </header>
    <section class="card">
        <div id="fleet-table"></div>
        <p class="hint" data-i18n="fleet.hint"></p>
    </section>
</section>

<!-- SHIFT — the driver's own screen ---------------------------------------->
<section class="view" data-view="shift">
    <header class="view-head">
        <h1>🎫 <span data-i18n="shift.h1"></span></h1>
        <p class="lede" data-i18n="shift.lede"></p>
    </header>
    <div id="shift-body"></div>
</section>

<!-- SIGN IN ---------------------------------------------------------------
     Not in any role's nav: it is reached by clicking a locked role, never chosen.
     A rider must be able to use the whole planner without ever seeing this. -->
<section class="view" data-view="signin">
    <header class="view-head">
        <h1>🔒 <span data-i18n="auth.h1"></span></h1>
        <p class="lede" data-i18n="auth.lede"></p>
    </header>
    <section class="card signin-card">
        <form id="signin-form" autocomplete="on">
            <label class="field-label" for="signin-user" data-i18n="auth.username"></label>
            <input type="text" id="signin-user" name="username" autocomplete="username"
                   autocapitalize="none" spellcheck="false" required>

            <label class="field-label" for="signin-pass" data-i18n="auth.password"></label>
            <input type="password" id="signin-pass" name="password"
                   autocomplete="current-password" required>

            <div id="signin-error" class="signin-error" role="alert"></div>
            <button type="submit" class="btn-primary" data-i18n="auth.signIn"></button>
        </form>

        <!-- These are demo credentials on a throwaway in-memory database, and an
             examiner has to be able to get in. Delete this block the moment any of
             it stops being true. -->
        <div class="signin-hint">
            <div class="signin-hint-head" data-i18n="auth.demoAccounts"></div>
            <div><code>admin</code> / <code>admin123</code> — <span data-i18n="role.admin"></span></div>
            <div><code>umyintswe</code> / <code>driver123</code> — <span data-i18n="role.driver"></span></div>
        </div>
    </section>
</section>

<!-- ABOUT ------------------------------------------------------------------>
<section class="view" data-view="about">
    <header class="view-head">
        <h1>ℹ️ <span data-i18n="about.h1"></span></h1>
        <p class="lede" data-i18n="about.lede"></p>
    </header>
    <div id="about-grid" class="about-grid"></div>
</section>

</main>
</div>

<!-- Arrival banner: hidden until the 400 m geofence fires -->
<div id="arrival-banner" class="arrival hidden">
    <div class="arrival-inner">
        <div class="arrival-icon">🔔</div>
        <div>
            <div class="arrival-my" data-i18n="alert.ready"></div>
            <div class="arrival-stop" id="arrival-stop"></div>
        </div>
        <button type="button" id="arrival-close" class="alt-btn">✖</button>
    </div>
</div>

<button type="button" id="help-fab" class="help-fab">
    <span aria-hidden="true">🙂</span><span data-i18n="a11y.needHelp"></span>
</button>

<script src="/vendor/leaflet.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
