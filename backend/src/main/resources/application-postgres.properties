# Postgres instead of MySQL. Combine with prod: SPRING_PROFILES_ACTIVE=prod,postgres
#
# Only two things actually change. The driver is picked from the URL anyway, so it is not
# set here - Spring works it out from jdbc:postgresql: and guessing wrong would be louder
# than leaving it alone.

spring.datasource.driverClassName=org.postgresql.Driver

# The JDBC URL is assembled from parts rather than taken whole, and that is not a style
# choice. Render publishes its database as a connectionString of the form
# postgres://user:pass@host/db, which JDBC cannot parse - it needs jdbc:postgresql://... -
# and render.yaml does not interpolate one environment variable into another. So the host,
# port and name arrive separately and are joined here, where interpolation does work.
#
# DB_URL still wins if it is set, so anything that hands over a proper JDBC URL - a VM, a
# local container, Railway - keeps working untouched.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ybs_db}}

# The seed is the ONE place the two databases genuinely differ. data.sql uses INSERT IGNORE
# so it is safe to re-run on a database that persists; Postgres has no such syntax and wants
# ON CONFLICT DO NOTHING, and there is no third form both accept.
#
# This must be set explicitly rather than relying on spring.sql.init.platform. That property
# ADDS data-${platform}.sql to the default list - it does not replace data.sql - so with
# platform=postgres Spring would run the MySQL file first and fail on INSERT IGNORE before
# ever reaching the Postgres one.
spring.sql.init.data-locations=optional:classpath:data-postgres.sql

# data-postgres.sql is generated from data.sql by tools/seed/to_postgres.py, and
# SeedFilesInSyncTest fails if the two have drifted. Edit data.sql, never this one.
