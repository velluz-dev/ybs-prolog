spring.application.name=ybs-demo
# 8080 is occupied on this machine by an unrelated AgentService process.
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ybs_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Yangon}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# data.sql is full of Burmese script; without this Spring reads it in the platform
# charset (cp1252 on this machine) and every stop name becomes mojibake.
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

demo.voice.mode=recorded

# Serve the browser assets from ../frontend first, then from the packaged jar.
# During development that means a frontend teammate edits frontend/app.js, hits refresh,
# and sees the change - no rebuild, no backend restart. The path is relative to the
# working directory, so it resolves when running `./mvnw spring-boot:run` from backend/.
# In a packaged jar ../frontend does not exist, Spring skips it, and the classpath copy
# (put there by the frontend <resource> block in pom.xml) is used instead.
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# Never let a browser cache the frontend.
# The frontend is edited constantly during development and served straight from
# ../frontend, so a cached app.js is not a stale detail - it silently runs OLD code.
# That cost real confusion once: the map kept showing three hand-built demo routes
# with names that no longer existed anywhere in the project, because the browser was
# still running JavaScript from before the real network was imported. Correctness of
# what you are looking at matters far more than a few kB on localhost.
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
