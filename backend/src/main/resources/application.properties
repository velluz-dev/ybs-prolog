spring.application.name=ybs-demo
# 8080 is occupied on this machine by an unrelated AgentService process.
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ybs_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Yangon}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# data.sql is full of Burmese script; without this Spring reads it in the platform
# charset (cp1252 on this machine) and every stop name becomes mojibake.
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Which speech path runs: recorded | whisper | mms.
#
# `recorded` is the default and the one that is demonstrated: no model, no network, three
# known transcripts, so the voice step cannot fail on stage. The other two are real clients
# to a self-hosted endpoint and fall back to `recorded` the moment it is unreachable, which
# the response says out loud in its `mode` field rather than hiding.
#
# `mms` is Meta's Massively Multilingual Speech (facebook/mms-1b-all). It is here rather
# than only Whisper because Burmese is in Whisper's long tail and is a first-class language
# for MMS - it ships per-language adapter weights for over 1,100 languages, so `mya` and
# `eng` are the same model with a different adapter rather than two different stories.
# docs/VOICE.md has a ~30-line server that satisfies this contract.
demo.voice.mode=recorded
demo.voice.meta.url=http://localhost:9100/v1/audio/transcriptions
demo.voice.meta.model=facebook/mms-1b-all
demo.voice.meta.timeout-ms=8000

# Live voice uploads. A ten-second clip of 16 kHz mono 16-bit PCM is about 320 KB, so 5 MB
# is generous; the cap exists so a stuck recorder cannot post a hundred megabytes at the JVM.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Serve the browser assets from ../frontend first, then from the packaged jar.
# During development that means a frontend teammate edits frontend/app.js, hits refresh,
# and sees the change - no rebuild, no backend restart. The path is relative to the
# working directory, so it resolves when running `./mvnw spring-boot:run` from backend/.
# In a packaged jar ../frontend does not exist, Spring skips it, and the classpath copy
# (put there by the frontend <resource> block in pom.xml) is used instead.
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# Never let a browser cache the frontend.
# The frontend is edited constantly during development and served straight from
# ../frontend, so a cached app.js is not a stale detail - it silently runs OLD code.
# That cost real confusion once: the map kept showing three hand-built demo routes
# with names that no longer existed anywhere in the project, because the browser was
# still running JavaScript from before the real network was imported. Correctness of
# what you are looking at matters far more than a few kB on localhost.
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
