# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# The base application.properties is tuned for a laptop during development: it serves the
# frontend straight off disk, disables every cache so a refresh shows your edit, and falls
# back to root/root if no database credentials are set. Every one of those is wrong the
# moment the app is reachable by anyone else, and this file is where each is corrected.

# --- database -----------------------------------------------------------------------
# No defaults. If DB_URL is missing the app must fail to start rather than quietly trying
# root/root against localhost - a deploy that silently points at the wrong database is
# worse than one that refuses to boot.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# `update` still suits this project: there are no migrations and the schema is whatever the
# entities say. It is worth knowing that it only ever ADDS - it will not drop a column you
# removed, so a rename leaves the old one behind until someone drops it by hand.
spring.jpa.hibernate.ddl-auto=update

# The seed is INSERT IGNORE throughout, so re-running it on an existing database is a no-op.
# Set SEED_MODE=never once the data is in and you would rather startup did not touch it.
spring.sql.init.mode=${SEED_MODE:always}

# --- static assets --------------------------------------------------------------------
# Development turns caching off so an edit shows up on refresh. In production that makes
# every visitor re-download roughly 2 MB of illustrations on every page view.
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600
spring.web.resources.cache.cachecontrol.no-store=false
spring.web.resources.cache.cachecontrol.must-revalidate=false
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.chain.cache=true

# --- cookies ---------------------------------------------------------------------------
# The CSRF token is deliberately readable by JavaScript - the frontend has to send it back
# in a header - which is safe only if the transport is encrypted. These two lines are the
# other half of that bargain, so put the app behind TLS before setting this profile.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Behind nginx or Caddy, honour X-Forwarded-* so redirects and cookie flags see https
# rather than the http of the internal hop.
server.forward-headers-strategy=framework

# --- voice ------------------------------------------------------------------------------
# The recogniser is a separate optional process. Leave this as `recorded` unless one is
# actually running and reachable - `mms` without a server just falls back anyway, but it
# costs every voice query a timeout first.
demo.voice.mode=${VOICE_MODE:recorded}

# --- noise --------------------------------------------------------------------------------
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
